[package]
name = "restclient-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "brotli", "cookies", "stream", "json", "multipart"] }
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
regex = "1.10"
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
dirs = "6.0"
tracing = "0.1"
bytes = "1"
futures-util = "0.3"
rquickjs = { version = "0.8", features = ["full", "loader"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
notify = "6.1"
