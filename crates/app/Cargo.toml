[package]
name = "zest"
version = "0.1.0"
edition = "2021"

[dependencies]
zest-core = { path = "../core" }
gpui = { package = "gpui-pre", version = "0.3.9" }
gpui-component = "0.7.3"
gpui-kit = { version = "0.7.3", features = ["component", "assets"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4" }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
url = "2.5"
rfd = "0.15"
lsp-types = { version = "0.97.0", features = ["proposed"] }
quick-xml = "0.41"
dirs = "6.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3.10"
