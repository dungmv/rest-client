name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (Win32 platform)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: restclient.exe
            platform_suffix: windows-x86_64

          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: restclient
            platform_suffix: linux-x86_64

          # macOS Apple Silicon (M-series)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: restclient
            platform_suffix: macos-arm64

          # macOS Intel (x86_64)
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: restclient
            platform_suffix: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libssl-dev \
            libzstd-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libasound2-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p restclient --target ${{ matrix.target }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          $ArchiveName = "restclient-${Tag}-${{ matrix.platform_suffix }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath $ArchiveName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item -Path $ArchiveName -Destination dist/

      - name: Package archive (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          APP_NAME="RestClient.app"
          CONTENTS="$APP_NAME/Contents"

          mkdir -p "$CONTENTS/MacOS"
          mkdir -p "$CONTENTS/Resources"

          # Copy binary and ensure execute permissions
          cp "target/${{ matrix.target }}/release/restclient" "$CONTENTS/MacOS/restclient"
          chmod +x "$CONTENTS/MacOS/restclient"

          # Populate Info.plist
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$CONTENTS/Info.plist"

          # Generate macOS .icns iconset
          ICONSET_DIR="AppIcon.iconset"
          mkdir -p "$ICONSET_DIR"
          sips -z 16 16     crates/app/resources/app_icon_16.png   --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32 32     crates/app/resources/app_icon_32.png   --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32 32     crates/app/resources/app_icon_32.png   --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64 64     crates/app/resources/app_icon_64.png   --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128 128   crates/app/resources/app_icon_128.png  --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256 256   crates/app/resources/app_icon_256.png  --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256 256   crates/app/resources/app_icon_256.png  --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512 512   crates/app/resources/app_icon.png      --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512 512   crates/app/resources/app_icon.png      --out "$ICONSET_DIR/icon_512x512.png"
          iconutil -c icns "$ICONSET_DIR" -o "$CONTENTS/Resources/AppIcon.icns"
          rm -rf "$ICONSET_DIR"

          # Ad-hoc code sign bundle (required for Apple Silicon M-series & Gatekeeper integrity)
          codesign --force --deep --sign - "$APP_NAME"

          mkdir -p dist

          # Build .dmg with drag-to-Applications shortcut
          DMG_TMP="dmg_root"
          mkdir -p "$DMG_TMP"
          cp -R "$APP_NAME" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "RestClient" -srcfolder "$DMG_TMP" -ov -format UDZO "dist/restclient-${TAG}-${{ matrix.platform_suffix }}.dmg"
          rm -rf "$DMG_TMP"

          # Also package .zip containing RestClient.app
          zip -r -y "dist/restclient-${TAG}-${{ matrix.platform_suffix }}.zip" "$APP_NAME"

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PKG_NAME="restclient-${TAG}-${{ matrix.platform_suffix }}"
          mkdir -p "$PKG_NAME"

          # Copy binary and ensure execute permissions
          cp "target/${{ matrix.target }}/release/restclient" "$PKG_NAME/restclient"
          chmod +x "$PKG_NAME/restclient"

          # Copy desktop integration files
          cp packaging/linux/restclient.desktop "$PKG_NAME/"
          cp packaging/linux/install.sh "$PKG_NAME/"
          cp packaging/linux/uninstall.sh "$PKG_NAME/"
          chmod +x "$PKG_NAME/install.sh" "$PKG_NAME/uninstall.sh"
          cp crates/app/resources/app_icon_256.png "$PKG_NAME/restclient.png"

          mkdir -p dist
          tar -czvf "dist/${PKG_NAME}.tar.gz" "$PKG_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - name: Generate Checksums (SHA-256)
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
